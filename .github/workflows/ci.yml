name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Foundry tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chain/package-lock.json

      - name: Install npm dependencies (OpenZeppelin, viem)
        run: npm ci --ignore-scripts

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std@v1.17.0 --no-git

      - name: Build
        run: forge build --sizes

      - name: Test (unit + fuzz; GmeGasRouter against a fork of Robinhood Chain mainnet)
        run: forge test -vv
        env:
          ROBINHOOD_RPC: https://robinhood.drpc.org

      - name: Deployed contracts match this source (bytecode check against mainnet)
        run: node scripts/verify-bytecode.js

  scripts:
    name: Scripts and site (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check every chain script and site script parses
        run: |
          set -e
          for f in chain/scripts/*.js site/js/*.js walletkit/src/*.jsx; do
            case "$f" in *.jsx) continue ;; esac
            node --check "$f"
            echo "ok $f"
          done

      - name: No secrets committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env($|\.)|nodeConfig\.[a-z]+\.json$|deploy/vps/secrets/' | grep -v '\.env\.example$'; then
            echo "Secret files are tracked"; exit 1
          fi
          if git grep -n -I -E '(PRIVATE_KEY|private_key)\s*=\s*(0x)?[0-9a-fA-F]{64}' -- . ':!*.md'; then
            echo "A private key is committed"; exit 1
          fi
          echo "no secrets found"

  static-analysis:
    name: Static analysis (Slither)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publish the findings in the repository's Security tab
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chain/package-lock.json

      - name: Install npm dependencies (OpenZeppelin)
        run: npm ci --ignore-scripts

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std@v1.17.0 --no-git

      - name: Install Slither
        run: pipx install slither-analyzer==0.11.6

      - name: Slither (fails on any High finding; triage in docs/static-analysis.md)
        run: slither . --config-file slither.config.json --fail-high --sarif slither.sarif

      - name: Public report on this run's Summary page
        if: always()
        run: |
          {
            echo "## Slither report"
            echo
            echo "How each finding was assessed: [docs/static-analysis.md](https://github.com/${{ github.repository }}/blob/main/docs/static-analysis.md)"
            echo
            slither . --config-file slither.config.json --checklist --show-ignored-findings --markdown-root "https://github.com/${{ github.repository }}/blob/${{ github.sha }}/chain/" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: chain/slither.sarif
          category: slither
