[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]

fs_permissions = [{ access = "read", path = "./node_modules/@uniswap/v2-core/build" }, { access = "read", path = "./node_modules/@uniswap/v2-periphery/build" }]

[fuzz]
runs = 5000
